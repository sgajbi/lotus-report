repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff pinned in pyproject.toml. A commit hook formatting
    # differently from CI is the same non-determinism the pin removes, moved to
    # the one place a developer meets it first.
    rev: v0.16.4
    hooks:
      - id: ruff
      - id: ruff-format

  # mypy runs from the repository environment rather than an isolated hook
  # environment, which is the only arrangement that makes it the same checker
  # CI runs. `mirrors-mypy` installs mypy alone, so every project import
  # resolves to `Any` under `ignore_missing_imports` and the hook silently
  # stops seeing an entire class of error: with the plugin's dependencies
  # added it still passed a real `prometheus_fastapi_instrumentator`
  # signature mismatch that `make typecheck` caught. Listing the full
  # typechecked dependency set here instead would be a second copy of
  # `pyproject.toml` maintained by hand, drifting exactly where it matters.
  #
  # The cost is that this hook needs the project environment on PATH. A missing
  # mypy fails loudly, but a mypy WITHOUT this project's dependencies does not:
  # `ignore_missing_imports` turns every unresolvable import into `Any` and the
  # run reports success having checked nothing. `run_typecheck_hook.py` refuses
  # that case by name before handing over to mypy. The prerequisite is stated
  # in the README and in wiki/Getting-Started.md.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (repository environment)
        entry: python scripts/run_typecheck_hook.py
        language: system
        pass_filenames: false
        # Always, not only when a `.py` file is staged. The hook already
        # checks the whole tree regardless of what changed, so gating it on
        # file type would mean a commit editing `mypy.ini` alone -- a change
        # to the gate's own configuration -- never runs the gate.
        always_run: true
