repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff pinned in pyproject.toml. A commit hook formatting
    # differently from CI is the same non-determinism the pin removes, moved to
    # the one place a developer meets it first.
    rev: v0.16.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Must match the mypy pinned in pyproject.toml, for the same reason as ruff
    # above: a hook reporting different errors from CI trains contributors to
    # distrust whichever one they met second.
    rev: v2.3.1
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        pass_filenames: false
