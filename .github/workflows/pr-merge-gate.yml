name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  python-image:
    uses: ./.github/workflows/image-acquisition.yml
    with:
      source-image: docker.io/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      distribution-image: public.ecr.aws/docker/library/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

  postgres-image:
    uses: ./.github/workflows/image-acquisition.yml
    with:
      source-image: docker.io/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      distribution-image: public.ecr.aws/docker/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-security:
    name: PR Merge Gate / Lint Typecheck Security
    needs: [python-image, postgres-image]
    runs-on: ubuntu-latest
    env:
      PYTHON_IMAGE: ${{ needs.python-image.outputs.image }}
      POSTGRES_IMAGE: ${{ needs.postgres-image.outputs.image }}
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_DB: lotus_report
          POSTGRES_USER: lotus_report
          POSTGRES_PASSWORD: lotus_report
        ports:
          - 5432:5432
        options: >-
          --platform linux/amd64
          --health-cmd "pg_isready -U lotus_report -d lotus_report"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: python -m pip check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Migration Contract Smoke
        env:
          REPORT_JOB_LEDGER_DATABASE_URL: postgresql://lotus_report:lotus_report@localhost:5432/lotus_report
          REPORT_JOB_LEDGER_DATABASE_IS_ISOLATED: "true"
        run: make migration-smoke
      - name: Verify Acquired PostgreSQL Service
        run: python scripts/verify_ci_image_acquisition.py --reference "$POSTGRES_IMAGE" --container-id '${{ job.services.postgres.id }}'
      - name: Security Audit
        run: make security-audit
      - name: Verify Acquired Audit Image
        run: python scripts/verify_ci_image_acquisition.py --reference "$PYTHON_IMAGE"
      - name: Code Health Gates
        run: make code-health-gates
      - name: Check Out Platform Domain Contracts
        uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          path: .lotus-platform
          sparse-checkout: platform-contracts
      - name: Domain Product Contract Gate
        env:
          LOTUS_PLATFORM_ROOT: ${{ github.workspace }}/.lotus-platform
        run: make domain-product-validate

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    needs: [lint-typecheck-security, postgres-image]
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: ${{ needs.postgres-image.outputs.image }}
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_DB: lotus_report
          POSTGRES_USER: lotus_report
          POSTGRES_PASSWORD: lotus_report
        ports:
          - 5432:5432
        options: >-
          --platform linux/amd64
          --health-cmd "pg_isready -U lotus_report -d lotus_report"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Verify Dependencies
        run: python -m pip check
      - name: Verify Acquired PostgreSQL Service
        run: python scripts/verify_ci_image_acquisition.py --reference "$POSTGRES_IMAGE" --container-id '${{ job.services.postgres.id }}'
      - name: Run tests with coverage data
        env:
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
          REPORT_JOB_LEDGER_DATABASE_URL: postgresql://lotus_report:lotus_report@localhost:5432/lotus_report
          REPORT_JOB_LEDGER_DATABASE_IS_ISOLATED: "true"
        run: make test-suite-coverage TEST_SUITE=${{ matrix.suite }} TEST_PATH=${{ matrix.path }}
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    needs: [test-suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data
      - name: Enforce coverage floor
        run: make coverage-gate COVERAGE_INPUTS=coverage-data

  docker-build:
    name: PR Merge Gate / Validate Docker Build
    needs: [coverage-gate, python-image]
    runs-on: ubuntu-latest
    env:
      PYTHON_IMAGE: ${{ needs.python-image.outputs.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: make docker-build
