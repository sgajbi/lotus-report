name: Merged PR Main Releasability Dispatch

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: write

jobs:
  dispatch-main-releasability:
    name: Dispatch Main Releasability
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Every revision the PR added must be enumerable, not just the head.
          fetch-depth: 0
      # The whole dispatch step is one program (report#364), conforming to the
      # platform merged-revision dispatch contract in its script form: landed
      # revisions are enumerated base..tip (never by commit count), guarded
      # (empty interval, asymmetric count cross-check, fetched-main ancestry,
      # single parent, contiguity), tagged main-releasability-<revision>
      # (immutable-ref tested-source identity, refused on conflict) and
      # dispatched sequentially oldest-first with expected_sha pinned.
      # Conformance is declared in
      # .github/merged-revision-dispatch.conformance.json and proven by the
      # behavior tests it names; the platform recognizer binds the declaration
      # to this exact run command.
      - name: Dispatch main releasability gate for every landed revision
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/dispatch_merged_revisions.py
