[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lotus-report"
version = "0.1.0"
description = "Reporting and aggregation service for PBWM platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2.3",
  "prometheus-client>=0.22.1",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "starlette>=1.6.0",
]

[project.urls]
Repository = "https://github.com/sgajbi/lotus-report"

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
  "radon==6.0.1",
  "vulture==2.16",
  "deptry==0.25.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.28.1",
  "ruff>=0.12.10",
  "mypy>=1.19.1",
  "pytest-cov>=6.2.1",
  "coverage>=7.10.6",
  "pre-commit>=4.3.0",
  "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.deptry]
# `app` is this repository's own package under `src`; `scripts` and `tests` are
# repo-local. Without this deptry reports every internal import as a transitive
# dependency - hundreds of false findings, which is how a dependency gate ends
# up switched off instead of configured.
known_first_party = [
  "app",
  "scripts",
  "tests",
  # scripts import each other bare and openapi tooling imports via `src.` paths.
  "src",
  "dependency_vulnerability_exceptions",
]
# The `dev` extra holds tooling invoked from the command line, never imported.
optional_dependencies_dev_groups = ["dev"]
[tool.deptry.package_module_name_map]
PyYAML = "yaml"
