x-lotus-report-service-environment: &lotus-report-service-environment
  LOTUS_CORE_QUERY_BASE_URL: http://host.docker.internal:8201
  LOTUS_PERFORMANCE_BASE_URL: http://host.docker.internal:8002
  RISK_BASE_URL: http://host.docker.internal:8130
  LOTUS_RENDER_BASE_URL: http://host.docker.internal:8310
  LOTUS_ARCHIVE_BASE_URL: http://host.docker.internal:8150
  LOTUS_AI_BASE_URL: http://host.docker.internal:8140
  REPORT_JOB_LEDGER_DATABASE_URL: postgresql://lotus_report:lotus_report@lotus-report-postgres:5432/lotus_report
  # Which store backs the Idea evidence intake ledger. Passed through from the
  # invoking shell so the documented cutover works, and defaulting to sqlite so
  # nothing changes until an operator sets it deliberately. Without this line an
  # exported value never reaches the container, and the cutover's verification
  # step would pass by replaying from the untouched SQLite file (report#326).
  REPORT_IDEA_EVIDENCE_INTAKE_LEDGER_BACKEND: ${REPORT_IDEA_EVIDENCE_INTAKE_LEDGER_BACKEND:-sqlite}

services:
  lotus-report-postgres:
    image: postgres:16-alpine
    container_name: lotus-report-postgres
    environment:
      POSTGRES_DB: lotus_report
      POSTGRES_USER: lotus_report
      POSTGRES_PASSWORD: lotus_report
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus_report -d lotus_report"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5439:5432"
    volumes:
      - lotus-report-postgres-data:/var/lib/postgresql/data

  lotus-report:
    build: .
    image: lotus-report:local
    container_name: lotus-report
    environment:
      <<: *lotus-report-service-environment
    depends_on:
      lotus-report-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8300:8300"
    volumes:
      # The Idea evidence intake ledger is SQLite at data/idea-evidence-intake.sqlite3,
      # relative to the image's /app working directory. Without this volume it lives in
      # the container's ephemeral layer, so container replacement destroys intake and
      # idempotency evidence and a replayed intake is accepted as new.
      #
      # Mounted on this service only: the API router is the sole constructor of
      # IdeaEvidenceIntakeLedger, and sharing one SQLite file between containers would
      # replace a durability gap with a multi-writer corruption risk.
      - lotus-report-intake-data:/app/data

  lotus-report-job-worker:
    build: .
    image: lotus-report-job-worker:local
    container_name: lotus-report-job-worker
    command:
      [
        "sh",
        "-c",
        "python -m app.runtime_schema && exec python -m app.reporting_jobs.process",
      ]
    environment:
      <<: *lotus-report-service-environment
      REPORT_JOB_WORKER_ID: lotus-report-job-worker-local
      REPORT_JOB_WORKER_INTERVAL_SECONDS: "1"
      REPORT_JOB_WORKER_METRICS_PORT: "8301"
      REPORT_JOB_WORKER_MAX_ITEMS_PER_PASS: "10"
      REPORT_JOB_WORKER_LEASE_SECONDS: "300"
    ports:
      - "8301:8301"
    depends_on:
      lotus-report-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lotus-report-batch-worker:
    build: .
    image: lotus-report-batch-worker:local
    container_name: lotus-report-batch-worker
    command:
      [
        "sh",
        "-c",
        "python -m app.runtime_schema && exec python -m app.report_batch_orchestrator.process",
      ]
    environment:
      <<: *lotus-report-service-environment
      REPORT_BATCH_WORKER_ID: lotus-report-batch-worker-local
      REPORT_BATCH_WORKER_TENANT_IDS: tenant-sg
      REPORT_BATCH_WORKER_INTERVAL_SECONDS: "5"
      REPORT_BATCH_WORKER_MAX_BATCHES_PER_PASS: "25"
      REPORT_BATCH_WORKER_MAX_ACTIVE_BATCHES: "1000"
      REPORT_BATCH_WORKER_MAX_ACTIVE_ITEMS: "1000"
    depends_on:
      lotus-report-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lotus-report-batch-scheduler:
    build: .
    image: lotus-report-batch-scheduler:local
    container_name: lotus-report-batch-scheduler
    command:
      [
        "sh",
        "-c",
        "python -m app.runtime_schema && exec python -m app.report_batch_orchestrator.scheduler_process",
      ]
    environment:
      <<: *lotus-report-service-environment
      REPORT_BATCH_SCHEDULER_ID: lotus-report-batch-scheduler-local
      REPORT_BATCH_SCHEDULER_INTERVAL_SECONDS: "30"
      REPORT_BATCH_SCHEDULES_JSON: "[]"
    depends_on:
      lotus-report-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lotus-report-postgres-data:
  lotus-report-intake-data:
